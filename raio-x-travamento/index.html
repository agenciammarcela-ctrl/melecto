<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raio-X do Travamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    /* identidade bmt fit */
    --ink: #3A2B2A;
    --ink-soft: #7A6560;
    --ground: #FFF6F1;
    --card: #FFFFFF;
    --line: #F3DDD2;
    --coral: #D6605A;          /* coral da marca */
    --coral-deep: #B8463F;     /* coral para botões (contraste com branco) */
    --peach: #F8C8A8;          /* pêssego da marca */
    --peach-soft: #FDE8DC;
    --grey: #CFCFCF;           /* cinza da marca */
    --brand-grad: linear-gradient(160deg, #D65B53 0%, #E07A78 55%, #EE9E8A 100%);
    --plum: var(--ink);
    --berry: var(--coral-deep);
    --berry-deep: #9C3833;
    --mint: #2E9C83;
    /* cores dos 5 travamentos (harmonizadas com a marca) */
    --cat-A: #E0764F; /* alimentação */
    --cat-B: #A8679E; /* constância */
    --cat-C: #DE9A34; /* rotina */
    --cat-D: #3F9C99; /* barriga e inchaço */
    --cat-E: #C94B5B; /* direção */
    --radius: 22px;
    --display: "Outfit", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .shell {
    max-width: 480px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 14px 40px;
  }
  /* topo */
  .topbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .brand {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600;
  }
  .brand b { color: var(--berry); font-weight: 700; }
  .brand > span:last-child { white-space: nowrap; }
  .progress { height: 8px; background: #F8DCCB; border-radius: 99px; overflow: hidden; }
  .progress > span {
    display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--peach), var(--coral));
    border-radius: 99px; transition: width .35s ease;
  }
  .progress-label { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  /* cards */
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 26px 22px;
    box-shadow: 0 1px 0 var(--line), 0 18px 40px -28px rgba(150, 60, 40, .3);
    display: flex; flex-direction: column; gap: 16px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .screen { animation: rise .35s ease both; }
    @keyframes rise { from { transform: translateY(10px); opacity: .5; } to { transform: none; opacity: 1; } }
  }
  .eyebrow {
    align-self: flex-start;
    font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 99px;
    background: var(--chip-bg, #FDE6DA); color: var(--chip-fg, var(--berry-deep));
  }
  h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; line-height: 1.12; }
  h1 { font-size: clamp(34px, 9vw, 44px); font-weight: 800; letter-spacing: -.02em; }
  h2 { font-size: clamp(24px, 6.4vw, 29px); font-weight: 700; letter-spacing: -.01em; }
  h3 { font-size: 18px; font-weight: 700; }
  h1:focus, h2:focus { outline: none; }
  p { margin: 0; }
  .muted { color: var(--ink-soft); }
  .small { font-size: 14px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }

  /* botões */
  .btn {
    appearance: none; border: 0; cursor: pointer;
    font: 700 17px/1 var(--body);
    padding: 17px 22px; border-radius: 16px;
    background: var(--berry); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; text-decoration: none;
    box-shadow: 0 10px 22px -12px rgba(184, 70, 63, .7);
    transition: transform .15s ease, background .15s ease;
  }
  .btn:hover { background: var(--berry-deep); }
  .btn:active { transform: scale(.98); }
  .btn:disabled { background: #EDCBBE; box-shadow: none; cursor: not-allowed; }
  .btn:focus-visible, .opt:focus-visible, .ghost:focus-visible, input:focus-visible, .goal:focus-visible {
    outline: 3px solid #F0A58A; outline-offset: 2px;
  }
  .btn.light { background: #fff; color: var(--coral-deep); box-shadow: 0 10px 22px -14px rgba(120, 40, 30, .6); }
  .btn.light:hover { background: #FDE6DA; }
  .nav { display: flex; gap: 10px; align-items: center; }
  .ghost {
    appearance: none; border: 1.5px solid var(--line); background: transparent; cursor: pointer;
    color: var(--ink-soft); font: 600 15px/1 var(--body); padding: 16px 16px; border-radius: 16px; flex: 0 0 auto;
  }
  .ghost:hover { color: var(--ink); border-color: #EBC4B0; }
  .nav .btn { flex: 1; }

  /* capa */
  .cover {
    position: relative; overflow: hidden;
    background: var(--brand-grad); color: #fff;
    border-radius: 28px; padding: 28px 24px 26px;
    display: flex; flex-direction: column; gap: 18px;
  }
  .cover::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(240px 200px at 100% 100%, rgba(248,200,168,.55), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 14px);
  }
  .scan {
    position: absolute; left: 0; right: 0; height: 70px; top: -70px; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255, 235, 222, .2) 70%, rgba(255, 245, 238, .6) 100%);
    border-bottom: 1px solid rgba(255, 250, 246, .9);
  }
  @media (prefers-reduced-motion: no-preference) {
    .scan { animation: scan 3.6s cubic-bezier(.5,0,.5,1) infinite; }
    @keyframes scan { 0% { top: -70px; } 60%, 100% { top: 100%; } }
  }
  .cover > *:not(.scan) { position: relative; }
  .cover .eyebrow { background: rgba(255,255,255,.2); color: #fff; }
  .cover h1 { color: #fff; }
  .cover h1 em { font-style: normal; color: #FFE0CC; }
  .cover .sub { font-family: var(--display); font-size: 21px; font-weight: 600; color: #FFF3EC; line-height: 1.25; }
  .cover p { color: #FFF1EA; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; padding: 6px 11px; border-radius: 99px;
    background: rgba(255,255,255,.2); color: #fff;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
  .chip .dot { box-shadow: 0 0 0 2px rgba(255,255,255,.85); }

  /* logo bmt fit (máscaras: herdam a cor do texto) */
  .mark, .word { display: inline-block; flex: 0 0 auto; background: currentColor; -webkit-mask: var(--m) center / contain no-repeat; mask: var(--m) center / contain no-repeat; }

  .logo { display: flex; align-items: center; gap: 12px; font-size: 34px; color: #fff; }
  .logo .word { font-size: 30px; }
  .brand-l { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
  .brand-l .mark { font-size: 22px; color: var(--coral); }

  /* formulário */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .legend { font-weight: 700; font-size: 14px; }
  .hint { font-weight: 500; color: var(--ink-soft); }
  .row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  input[type=text], input[type=number], input[type=tel], input[type=email] {
    width: 100%; font: 500 17px var(--body); color: var(--ink);
    padding: 14px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: #FFFAF7;
  }
  input::placeholder { color: #BCA69E; }
  input[aria-invalid=true] { border-color: #D6605A; background: #FFF1EE; }
  .err { color: #B03A34; font-size: 13px; font-weight: 600; }
  .err:empty { display: none; }
  .goals { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .goal {
    appearance: none; cursor: pointer; text-align: left;
    font: 600 14px/1.3 var(--body); color: var(--ink);
    padding: 12px 12px; border-radius: 14px; border: 1.5px solid var(--line); background: #FFFAF7;
    display: flex; gap: 8px; align-items: flex-start;
  }
  .goal b { color: var(--berry); }
  .goal[aria-pressed=true] { border-color: var(--berry); background: #FDE6DA; }

  .consent { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; color: var(--ink-soft); cursor: pointer; }
  .consent input { width: 20px; height: 20px; margin: 1px 0 0; flex: 0 0 auto; accent-color: var(--coral-deep); }

  /* números grandes */
  .big {
    display: flex; flex-direction: column; gap: 4px;
    padding: 20px; border-radius: 18px; background: var(--big-bg, #E6F5F1);
  }
  .big .num {
    font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: -.02em;
    color: var(--big-fg, #1E7864); font-variant-numeric: tabular-nums;
  }
  .big .num small { font-size: 22px; font-weight: 700; }
  .formula {
    font-family: var(--display); font-weight: 700; font-size: 17px;
    padding: 12px 14px; border-radius: 14px; background: #FEF4EE; border: 1.5px dashed #EBC4B0;
  }
  .note {
    font-size: 13.5px; color: var(--ink-soft);
    padding: 12px 14px; border-radius: 14px; background: #FBF3EF;
  }
  .note strong { color: var(--ink); }

  /* escala do IMC */
  .scale { display: flex; flex-direction: column; gap: 6px; }
  .scale-row {
    display: grid; grid-template-columns: 96px 1fr; gap: 10px; align-items: center;
    padding: 9px 12px; border-radius: 12px; font-size: 14px; background: #FDF4EF;
  }
  .scale-row .rng { font-weight: 700; font-variant-numeric: tabular-nums; }
  .scale-row.on { background: var(--on-bg, #E6F5F1); outline: 2px solid var(--on-fg, #2E9C83); }

  /* tabela de peso */
  .wtable { display: flex; flex-direction: column; gap: 6px; }
  .wrow {
    display: flex; justify-content: space-between; gap: 10px; align-items: center;
    padding: 11px 14px; border-radius: 12px; background: #FDF4EF; font-variant-numeric: tabular-nums; font-size: 15px;
  }
  .wrow b { font-weight: 700; }
  .wrow.on { background: #FFF1DC; outline: 2px solid var(--cat-C); }

  /* perguntas */

  /* resumo */

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

    background: var(--card); border-radius: 16px; padding: 12px 10px;

  .tile .k { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-soft); }
  .tile .v { font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1.05; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .tile .s { font-size: 12px; color: var(--ink-soft); line-height: 1.3; }

  /* CTA */
  .cta {
    background: var(--brand-grad);
    color: #fff; border-radius: 28px; padding: 30px 24px;

  .restart { align-self: center; background: none; border: 0; color: var(--ink-soft); font: 600 14px var(--body); text-decoration: underline; cursor: pointer; padding: 8px; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);

    box-shadow: 0 10px 30px -10px rgba(0,0,0,.4);

  .foot { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 18px; }

  @media (max-width: 370px) {
    .row { grid-template-columns: 1fr 1fr; }
    .row .field:first-child { grid-column: 1 / -1; }
    .goals { grid-template-columns: 1fr; }
    .tile .v { font-size: 19px; }

</style>

<body>

<script>

  ["Sobre água, sono e intestino, você diria que:", [

    acaoTitulo: "Escolha uma refeição do dia para organizar melhor.",
    acaoIntro: "Pode ser o almoço, o jantar ou o café da manhã. Monte pensando em:",
    acaoLista: ["uma fonte de proteína;", "uma fonte de carboidrato;", "uma fonte de fibra;", "um alimento que te dê prazer sem tirar você do caminho."],
    acaoFim: "Não tente arrumar a alimentação inteira hoje. Comece por uma refeição.",
    proximo: ["Para secar com mais constância, você não precisa viver de cortes.", "Você precisa aprender a comer melhor dentro da sua vida."]
  },
  B: {
    titulo: "Seu maior travamento parece estar na constância.",
    corpo: [
      { p: "Você provavelmente já começou muitas vezes." },
      { beats: ["Começou animada.", "Comprou coisas saudáveis.", "Treinou alguns dias.", "Prometeu que agora seria diferente."] },
      { p: "Mas, quando a rotina apertou, você perdeu o ritmo. E aí veio a sensação de sempre: “eu não consigo manter.”" },
      { p: "Mas constância não nasce de motivação. <strong>Constância nasce de um plano possível.</strong>" },
      { p: "Se você começa tentando mudar tudo ao mesmo tempo, qualquer imprevisto vira motivo para parar." }
    ],
    pergunta: "Você tem tentado ser constante ou tem tentado ser perfeita?",
    acaoTitulo: "Escolha uma única ação mínima para repetir pelos próximos 3 dias.",
    acaoIntro: "Pode ser:",
    acaoLista: ["beber mais água;", "fazer uma caminhada curta;", "organizar uma refeição;", "dormir 30 minutos mais cedo;", "reduzir beliscos à noite;", "deixar uma proteína pronta."],
    acaoFim: "A regra é: precisa ser tão simples que você consiga fazer mesmo em um dia comum.",
    proximo: ["Seu resultado não vai vir de uma semana perfeita.", "Vai vir de pequenas escolhas repetidas com direção."]
  },
  C: {
    titulo: "Seu maior travamento parece estar na rotina.",
    corpo: [
      { p: "Talvez você saiba o que deveria fazer. Mas sua vida não está organizada para facilitar isso." },
      { beats: ["Você acorda no automático.", "Come o que dá.", "Bebe pouca água.", "Improvisa refeições.", "Deixa treino para depois.", "Chega à noite cansada e tenta compensar tudo no dia seguinte."] },
      { p: "A rotina manda no seu resultado mais do que você imagina." },

      { p: "Ela conversa com o seu intestino, água, sono, fibras, estresse, treino, beliscos, ciclo, álcool, doces, final de semana e constância." },
      { p: "Quando você olha só para a comida, pode ignorar sinais importantes do seu corpo." }
    ],
    pergunta: "Você está tentando secar a barriga só com restrição ou está olhando para os hábitos que mantêm seu corpo inflamado, inchado ou desregulado?",
    acaoTitulo: "Escolha um hábito anti-inchaço para ajustar nas próximas 24 horas.",
    acaoIntro: "Pode ser:",
    acaoLista: ["beber sua meta de água{AGUA};", "incluir uma porção de vegetais;", "comer com mais calma;", "reduzir beliscos;", "dormir mais cedo;", "caminhar 20 minutos;", "observar como seu intestino está funcionando."],

  },
  E: {

const FAIXAS_PESO = [
  [1.50, 1.56, 42, 61], [1.57, 1.62, 46, 65], [1.63, 1.68, 49, 70], [1.69, 1.74, 53, 75], [1.75, 1.80, 57, 81]
];

const IMC_FAIXAS = [
  { max: 18.5, rng: "abaixo de 18,5", nome: "abaixo do peso", bg: "#FFF1DC", fg: "#B26B00" },
  { max: 25, rng: "18,5 a 24,9", nome: "faixa considerada saudável", bg: "#E6F5F1", fg: "#1E7864" },
  { max: 30, rng: "25 a 29,9", nome: "sobrepeso", bg: "#FFF1DC", fg: "#B26B00" },
  { max: Infinity, rng: "30 ou mais", nome: "obesidade", bg: "#FDE6DA", fg: "#A8403B" }
];

/* Etapas: 0 capa · 1 dados · 2–9 perguntas · 10 contato (e-mail) · 11 água · 12 IMC · 13 peso
   · 14 contagem · 15 diagnóstico · 16 CTA */
const Q0 = 2, CONTATO = 10, AGUA = 11, IMC = 12, PESO = 13, RESUMO = 14, DIAGNOSTICO = 15, CTA = 16;
const TOTAL = CTA;
const STORE = "raioX-travamento-v2";
const blank = () => ({ step: 0, nome: "", email: "", telefone: "", consent: false, enviadoPara: "", idade: "", altura: "", peso: "", objetivo: "", answers: Array(8).fill(null) });
let state = blank();
try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.answers)) state = Object.assign(blank(), s); } catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} };

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const num = v => parseFloat(String(v).replace(",", ".").trim());
const fmt = (n, d = 1) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const primeiroNome = () => esc(state.nome.trim().split(/\s+/)[0] || "");

function alturaM() { let h = num(state.altura); if (h > 3) h = h / 100; return h; }
function pesoKg() { return num(state.peso); }

function calcAgua() {
  const ml = Math.round(pesoKg() * 35);
  const litros = ml / 1000;
  return { ml, litros, txt: litros.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 2 }) };
}
function calcImc() {
  const h = alturaM();
  const imc = Math.round((pesoKg() / (h * h)) * 10) / 10;
  const faixa = IMC_FAIXAS.find(f => imc < f.max);
  return { imc, faixa };
}
function faixaPeso() {
  const h = Math.round(alturaM() * 100) / 100;
  return FAIXAS_PESO.find(f => h >= f[0] && h <= f[1]) || null;
}
function placar() {
  const c = { A: 0, B: 0, C: 0, D: 0, E: 0 };
  state.answers.forEach(a => { if (a) c[a]++; });
  const max = Math.max(...Object.values(c));
  const top = Object.keys(c).filter(k => c[k] === max);
  return { c, max, top };
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
function go(step) {
  state.step = Math.max(0, Math.min(TOTAL, step)); save(); render();
  window.scrollTo({ top: 0 });
  const h = $("#app h1, #app h2"); if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
}

/* ---------- telas ---------- */
function telaCapa() {
  const chips = Object.keys(CATS).map(k => `<span class="chip"><span class="dot" style="--c:var(--cat-${k})"></span>${CATS[k].curto}</span>`).join("");
  return `
  <section class="screen cover">
    <div class="scan" aria-hidden="true"></div>
    <span class="eyebrow">Quiz · 3 minutos</span>
    <h1>Raio-X do <em>Travamento</em></h1>
    <p class="sub">O que está te impedindo de secar?</p>
    <p>Descubra o que pode estar travando sua barriga, sua constância e seus resultados — e veja por onde começar agora para chegar em janeiro diferente.</p>
    <div class="chips" aria-label="Os 5 travamentos avaliados">${chips}</div>
    <button class="btn light" data-go="1">Começar meu Raio-X →</button>
  </section>`;
}

function telaDados() {
  const goals = OBJETIVOS.map(([k, t]) =>
    `<button type="button" class="goal" data-goal="${esc(t)}" aria-pressed="${state.objetivo === t}"><b>${k})</b> ${t}</button>`).join("");
  return `
  <form class="screen card" id="formDados" novalidate>
    <span class="eyebrow">Seus dados</span>
    <h2>Antes de começar, preciso de algumas informações suas</h2>
    <div class="field">
      <label for="nome">Nome</label>
      <input type="text" id="nome" autocomplete="given-name" placeholder="Como você gosta de ser chamada?" value="${esc(state.nome)}">
      <span class="err" id="err-nome"></span>
    </div>
    <div class="row">
      <div class="field">
        <label for="idade">Idade</label>
        <input type="number" id="idade" inputmode="numeric" placeholder="34" value="${esc(state.idade)}">
      </div>
      <div class="field">
        <label for="altura">Altura <span class="hint">(m)</span></label>
        <input type="text" id="altura" inputmode="decimal" placeholder="1,65" value="${esc(state.altura)}">
      </div>
      <div class="field">
        <label for="peso">Peso <span class="hint">(kg)</span></label>
        <input type="text" id="peso" inputmode="decimal" placeholder="70" value="${esc(state.peso)}">
      </div>
    </div>
    <span class="err" id="err-medidas"></span>
    <div class="field" role="group" aria-labelledby="lg-obj">
      <span class="legend" id="lg-obj">Objetivo principal <span class="hint">— escolha o que mais combina com você hoje</span></span>
      <div class="goals">${goals}</div>
      <span class="err" id="err-obj"></span>
    </div>
    <div class="nav">
      <button type="button" class="ghost" data-go="0">Voltar</button>
      <button type="submit" class="btn">Começar o quiz</button>
    </div>
  </form>`;
}

function telaContato() {
  const nome = primeiroNome();
  return `
  <form class="screen card" id="formContato" novalidate>
    <span class="eyebrow">Raio-X concluído</span>
    <h2>${nome ? nome + ", seu" : "Seu"} Raio&#8209;X está pronto</h2>
    <p class="muted">Deixe seu e-mail para receber o resultado completo: seu travamento, sua meta de água, seu IMC, sua referência de peso e a ação para começar hoje. Assim você não perde nada.</p>
    <div class="field">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email" inputmode="email" placeholder="voce@email.com" value="${esc(state.email)}">
      <span class="err" id="err-email"></span>
    </div>
    <div class="field">
      <label for="telefone">WhatsApp <span class="hint">(com DDD)</span></label>
      <input type="tel" id="telefone" autocomplete="tel-national" inputmode="tel" placeholder="(11) 98765-4321" value="${esc(state.telefone)}">
      <span class="err" id="err-tel"></span>
    </div>
    <label class="consent" for="consent">
      <input type="checkbox" id="consent" ${state.consent ? "checked" : ""}>
      <span>Autorizo a equipe da Thaís Tavares a salvar meus dados, me enviar meu resultado por e-mail e falar comigo pelo WhatsApp.</span>
    </label>
    <span class="err" id="err-consent"></span>
    <div class="nav">
      <button type="button" class="ghost" data-go="${Q0 + 7}">Voltar</button>
      <button type="submit" class="btn">Receber meu resultado</button>
    </div>
  </form>`;
}

function telaAgua() {
  const a = calcAgua();
  const menor = num(state.idade) < 18;
  return `
  <section class="screen card">
    <span class="eyebrow" style="--chip-bg:#E1F3F6;--chip-fg:#0F6E7B">Sua entrega · 1 de 3 · Água</span>
    <h2>Sua referência diária de água</h2>
    <p class="muted">Para adultos, a média usada é:</p>
    <div class="formula">Peso em kg × 35 ml</div>
    <p class="small muted">Exemplo: 70 kg × 35 ml = 2.450 ml → 2,45 litros por dia.</p>
    <div class="big" style="--big-bg:#E1F3F6;--big-fg:#0F6E7B">
      <span class="small">${primeiroNome() ? primeiroNome() + ", com" : "Com"} base no seu peso, sua meta aproximada é de:</span>
      <span class="num">${a.txt} <small>litros/dia</small></span>
      <span class="small muted">${fmt(pesoKg(), pesoKg() % 1 ? 1 : 0)} kg × 35 ml = ${a.ml.toLocaleString("pt-BR")} ml</span>
    </div>
    ${menor ? `<p class="note"><strong>Você informou menos de 18 anos.</strong> Essa fórmula é pensada para adultos — para adolescentes, a referência deve ser orientada por um profissional.</p>` : ""}
    <p class="note">Essa é uma estimativa geral. Necessidades individuais podem variar conforme rotina, clima, treino, saúde e orientação profissional.</p>
    <div class="nav"><button class="ghost" data-go="${CONTATO}">Voltar</button><button class="btn" data-go="${IMC}">Avançar</button></div>
  </section>`;
}

function telaImc() {
  const { imc, faixa } = calcImc();
  const menor = num(state.idade) < 18;
  const escala = IMC_FAIXAS.map(f =>
    `<div class="scale-row ${f === faixa ? "on" : ""}" style="--on-bg:${f.bg};--on-fg:${f.fg}"><span class="rng">${f.rng}</span><span>${f.nome}</span></div>`).join("");
  return `
  <section class="screen card">
    <span class="eyebrow" style="--chip-bg:#E6F5F1;--chip-fg:#1E7864">Sua entrega · 2 de 3 · IMC</span>
    <h2>Seu IMC estimado</h2>
    <p class="muted">O IMC, ou Índice de Massa Corporal, é o peso dividido pela altura ao quadrado.</p>
    <div class="formula">IMC = peso ÷ (altura × altura)</div>
    <div class="big" style="--big-bg:${faixa.bg};--big-fg:${faixa.fg}">
      <span class="small">Seu IMC estimado é:</span>
      <span class="num">${fmt(imc)}</span>
      <span class="small"><strong>${faixa.nome[0].toUpperCase() + faixa.nome.slice(1)}</strong> · ${fmt(pesoKg(), pesoKg() % 1 ? 1 : 0)} kg ÷ (${fmt(alturaM(), 2)} × ${fmt(alturaM(), 2)})</span>
    </div>
    <div class="scale" aria-label="Classificação do IMC">${escala}</div>
    ${menor ? `<p class="note"><strong>Menos de 18 anos:</strong> para adolescentes, o IMC é avaliado por curvas de idade e sexo, não por essa tabela.</p>` : ""}
    <p class="note"><strong>O IMC é apenas uma referência.</strong> Ele não avalia composição corporal, massa muscular, gordura localizada, retenção, metabolismo, histórico de saúde ou hábitos. Por isso, não deve ser usado sozinho para definir resultado.</p>
    <div class="nav"><button class="ghost" data-go="${AGUA}">Voltar</button><button class="btn" data-go="${PESO}">Avançar</button></div>
  </section>`;
}

function telaPeso() {
  const f = faixaPeso();
  const linhas = FAIXAS_PESO.map(r =>
    `<div class="wrow ${r === f ? "on" : ""}"><span>${fmt(r[0], 2)} a ${fmt(r[1], 2)} m</span><b>${r[2]} a ${r[3]} kg</b></div>`).join("");
  const destaque = f
    ? `<div class="big" style="--big-bg:#FFF1DC;--big-fg:#9A5A00"><span class="small">Para a sua altura (${fmt(alturaM(), 2)} m), a referência é:</span><span class="num">${f[2]}–${f[3]} <small>kg</small></span></div>`
    : `<p class="note"><strong>Essa tabela traz uma referência para alturas entre 1,50 m e 1,80 m.</strong> Para uma análise individual, o ideal é avaliar composição corporal, histórico, rotina e objetivo.</p>`;
  return `
  <section class="screen card">
    <span class="eyebrow" style="--chip-bg:#FFF1DC;--chip-fg:#9A5A00">Sua entrega · 3 de 3 · Peso</span>
    <h2>Sua referência de peso saudável 👇🏼</h2>
    ${destaque}
    <div class="wtable" aria-label="Tabela de referência por altura">${linhas}</div>
    <p>Essa é uma referência baseada no IMC saudável. <strong>Mas peso não diz tudo.</strong></p>
    <p class="muted">O mais importante é saúde, composição corporal, hábitos, constância e como o seu corpo responde à sua rotina.</p>
    <div class="nav"><button class="ghost" data-go="${IMC}">Voltar</button><button class="btn" data-go="${RESUMO}">Ver meu travamento</button></div>
  </section>`;
}

function telaPergunta(i) {
  const [q, opts] = PERGUNTAS[i];
  const sel = state.answers[i];
  const botoes = opts.map((t, j) => {
    const k = "ABCDE"[j];
    return `<button type="button" class="opt" data-ans="${k}" aria-pressed="${sel === k}"><span class="let">${k}</span><span>${t}</span></button>`;
  }).join("");
  return `
  <section class="screen card">
    <span class="qnum">Pergunta ${i + 1} de 8</span>
    <h2>${q}</h2>
    <div class="opts">${botoes}</div>
    <div class="nav">
      <button class="ghost" data-go="${i === 0 ? 1 : Q0 + i - 1}">Voltar</button>
      <button class="btn" data-go="${Q0 + i + 1}" ${sel ? "" : "disabled"}>${i === 7 ? "Finalizar" : "Avançar"}</button>
    </div>
  </section>`;
}

function telaResumo() {
  const { c, max, top } = placar();
  const barras = Object.keys(CATS).map(k => `
    <div class="bar ${top.includes(k) ? "" : "dim"}" style="--c:var(--cat-${k})">
      <span class="lbl"><span class="dot"></span>${k}) ${CATS[k].nome}</span>
      <span class="val">${c[k]}</span>
      <div class="track"><div class="fill" style="width:${(c[k] / 8) * 100}%"></div></div>
    </div>`).join("");
  return `
  <section class="screen card">
    <span class="eyebrow">Sua contagem</span>
    <h2>Agora veja o seu Raio-X</h2>
    <p class="muted">Cada resposta soma 1 ponto para uma letra. A letra que mais apareceu mostra seu principal travamento hoje.</p>
    <div class="bars">${barras}</div>
    ${top.length > 1 ? `<p class="tie-note">Deu empate entre ${top.map(k => CATS[k].curto.toLowerCase()).join(" e ")}. Seu resultado pode estar travado por mais de um ponto — vou te mostrar ${top.length === 2 ? "os dois diagnósticos" : "todos eles"}.</p>` : ""}
    <div class="nav"><button class="ghost" data-go="${PESO}">Voltar</button><button class="btn" data-go="${DIAGNOSTICO}">Abrir meu diagnóstico</button></div>
  </section>`;
}

function blocoDiag(k, idx, total) {
  const d = DIAG[k];
  const agua = calcAgua();
  const corpo = d.corpo.map(b => b.beats
    ? `<div class="beats">${b.beats.map(x => `<span>${x}</span>`).join("")}</div>`
    : `<p>${b.p}</p>`).join("");
  const lista = d.acaoLista ? `<p>${d.acaoIntro}</p><ul>${d.acaoLista.map(x => `<li>${x.replace("{AGUA}", ` (${agua.txt} L)`)}</li>`).join("")}</ul>` : "";
  const escrever = d.acaoEscrever ? d.acaoEscrever.map(x => `<div class="write">${x}</div>`).join("") : "";
  return `
  <article class="card diag" style="--c:var(--cat-${k})">
    <span class="eyebrow">${total > 1 ? `Diagnóstico ${idx + 1} de ${total} · ` : ""}${k}) ${CATS[k].nome}</span>
    <h2>${d.titulo}</h2>
    <div class="stack">${corpo}</div>
    <div class="reflect"><span class="k">Pergunta para você</span><q>${d.pergunta}</q></div>
    <div class="todo">
      <span class="k">Ação simples para hoje</span>
      <h3>${d.acaoTitulo}</h3>
      ${lista}${escrever}
      <p class="small muted">${d.acaoFim}</p>
    </div>
    <div class="next"><span class="k">Próximo passo</span>${d.proximo.map(x => `<p><strong>${x}</strong></p>`).join("")}</div>
  </article>`;
}

function telaResultado() {
  const { top } = placar();
  const a = calcAgua(), { imc, faixa } = calcImc(), f = faixaPeso();
  const nome = primeiroNome();
  const principal = top[0];
  return `
  <div class="screen stack">
    <section class="result-hero" style="--c:var(--cat-${principal})">
      <span class="eyebrow">Raio-X ${nome ? "de " + nome : "pronto"}</span>
      <h1>${top.length > 1 ? "Seu travamento tem mais de um ponto" : CATS[principal].nome}</h1>
      <p>${top.length > 1 ? top.map(k => CATS[k].nome).join(" + ") : `Objetivo: ${esc(state.objetivo.toLowerCase())}. Olha o que o seu Raio-X mostrou 👇🏼`}</p>
    </section>
    <div class="tiles">
      <div class="tile"><span class="k">Água</span><span class="v">${a.txt} L</span><span class="s">por dia, aprox.</span></div>
      <div class="tile"><span class="k">IMC</span><span class="v">${fmt(imc)}</span><span class="s">${faixa.nome}</span></div>
      <div class="tile"><span class="k">Peso ref.</span><span class="v">${f ? `${f[2]}–${f[3]}` : "—"}</span><span class="s">${f ? "kg p/ sua altura" : "fora da tabela"}</span></div>
    </div>
    <p class="note">Água, IMC e peso são referências gerais — não definem sozinhos o seu resultado.</p>
    ${top.map((k, i) => blocoDiag(k, i, top.length)).join("")}
    ${state.enviadoPara ? `<p class="note">📩 Enviei seu resultado completo para <strong>${esc(state.enviadoPara)}</strong>. Se não aparecer em alguns minutos, olhe o spam ou a aba Promoções.</p>` : ""}
    <div class="nav"><button class="ghost" data-go="${RESUMO}">Voltar</button><button class="btn" data-go="${CTA}">Continuar</button></div>
  </div>`;
}

function telaCta() {
  return `
  <div class="screen stack">
    <section class="cta">
      <div class="logo" role="img" aria-label="bmt fit"><span class="mark"></span><span class="word"></span></div>
      <span class="eyebrow">Próximo passo</span>
      <h2>Quer começar com mais direção?</h2>
      <p>Se o seu Raio-X mostrou que você não está travada por falta de vontade, mas por falta de clareza, rotina, constância ou acompanhamento, talvez esse seja o momento de parar de tentar sozinha.</p>
      <p>O BMT foi criado para mulheres que querem construir o corpo, a alimentação e os hábitos que desejam com plano, ajustes e suporte.</p>
      <p class="punch">Não é sobre fazer loucura até janeiro.<br>É sobre começar agora com direção.</p>
      <p>Para entender mais sobre o BMT, fale com a equipe:</p>
      <a class="btn light" id="ctaLink" href="${esc(LINK_COMERCIAL || "#")}" target="_blank" rel="noopener">Quero entender o BMT →</a>
    </section>
    <div class="nav"><button class="ghost" data-go="${DIAGNOSTICO}" style="flex:1">Rever meu diagnóstico</button></div>
    <button class="restart" id="refazer">Refazer o Raio-X do zero</button>
  </div>`;
}

/* ---------- render ---------- */
function render() {
  const s = state.step;
  let html;
  if (s === 0) html = telaCapa();
  else if (s === 1) html = telaDados();
  else if (s < CONTATO) html = telaPergunta(s - Q0);
  else if (s === CONTATO) html = telaContato();
  else if (s === AGUA) html = telaAgua();
  else if (s === IMC) html = telaImc();
  else if (s === PESO) html = telaPeso();
  else if (s === RESUMO) html = telaResumo();
  else if (s === DIAGNOSTICO) html = telaResultado();
  else html = telaCta();
  $("#app").innerHTML = html;

  const pct = Math.round((s / TOTAL) * 100);
  $("#progressWrap").hidden = s === 0;
  $("#progressFill").style.width = pct + "%";
  $("#progress").setAttribute("aria-valuenow", pct);

  bind();
}

function telDigitos() { return String(state.telefone).replace(/\D/g, ""); }
function telValido() { const n = telDigitos().length; return n >= 10 && n <= 13; }

function emailValido() { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(state.email.trim()); }
function contatoValido() { return emailValido() && telValido() && state.consent; }

/* Envia os dados brutos; o Apps Script recalcula tudo, grava na planilha e manda o e-mail.
   Só reenvia se o e-mail mudar. */
function enviarLead() {
  const email = state.email.trim();
  if (!PLANILHA_URL || !contatoValido() || state.enviadoPara === email) return;
  const body = JSON.stringify({
    nome: state.nome.trim(), email, telefone: state.telefone.trim(),
    objetivo: state.objetivo, idade: state.idade, altura: alturaM(), peso: pesoKg(),
    respostas: state.answers.join("")
  });
  // no-cors + text/plain: o Apps Script recebe sem precisar de CORS
  fetch(PLANILHA_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body })
    .catch(() => { state.enviadoPara = ""; save(); });
  state.enviadoPara = email; save();
}

function dadosValidos() {
  const h = alturaM(), p = pesoKg(), i = num(state.idade);
  return state.nome.trim() && state.objetivo && i >= 12 && i <= 100 && h >= 1.2 && h <= 2.2 && p >= 30 && p <= 250;
}

function bind() {
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(+b.dataset.go)));

  const form = $("#formDados");
  if (form) {
    ["nome", "idade", "altura", "peso"].forEach(id => $("#" + id).addEventListener("input", e => { state[id] = e.target.value; save(); }));
    form.querySelectorAll("[data-goal]").forEach(b => b.addEventListener("click", () => {
      state.objetivo = b.dataset.goal; save();
      form.querySelectorAll("[data-goal]").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#err-obj").textContent = "";
    }));
    form.addEventListener("submit", e => {
      e.preventDefault();
      const h = alturaM(), p = pesoKg(), i = num(state.idade);
      const errs = [];
      $("#err-nome").textContent = state.nome.trim() ? "" : "Me conta seu nome para personalizar o resultado.";
      $("#nome").setAttribute("aria-invalid", !state.nome.trim());
      const badI = !(i >= 12 && i <= 100), badH = !(h >= 1.2 && h <= 2.2), badP = !(p >= 30 && p <= 250);
      $("#idade").setAttribute("aria-invalid", badI); $("#altura").setAttribute("aria-invalid", badH); $("#peso").setAttribute("aria-invalid", badP);
      if (badI) errs.push("idade em anos (ex.: 34)");
      if (badH) errs.push("altura em metros (ex.: 1,65)");
      if (badP) errs.push("peso em kg (ex.: 70)");
      $("#err-medidas").textContent = errs.length ? "Confira: " + errs.join(" · ") + "." : "";
      $("#err-obj").textContent = state.objetivo ? "" : "Escolha seu objetivo principal.";
      if (dadosValidos()) go(Q0);
      else { const bad = form.querySelector("[aria-invalid=true]"); if (bad) bad.focus(); }
    });
  }

  const fc = $("#formContato");
  if (fc) {
    ["email", "telefone"].forEach(id => $("#" + id).addEventListener("input", e => {
      state[id] = e.target.value; save();
      e.target.removeAttribute("aria-invalid"); $(id === "email" ? "#err-email" : "#err-tel").textContent = "";
    }));
    $("#consent").addEventListener("change", e => { state.consent = e.target.checked; save(); $("#err-consent").textContent = ""; });
    fc.addEventListener("submit", e => {
      e.preventDefault();
      $("#err-email").textContent = emailValido() ? "" : "Confira seu e-mail (ex.: voce@email.com).";
      $("#email").setAttribute("aria-invalid", !emailValido());
      $("#err-tel").textContent = telValido() ? "" : "Informe seu WhatsApp com DDD (ex.: 11 98765-4321).";
      $("#telefone").setAttribute("aria-invalid", !telValido());
      $("#err-consent").textContent = state.consent ? "" : "Marque a autorização para receber seu resultado.";
      if (contatoValido()) { enviarLead(); go(AGUA); }
      else { const bad = fc.querySelector("[aria-invalid=true]") || $("#consent"); bad.focus(); }
    });
  }

  document.querySelectorAll("[data-ans]").forEach(b => b.addEventListener("click", () => {
    const i = state.step - Q0;
    state.answers[i] = b.dataset.ans; save();
    document.querySelectorAll("[data-ans]").forEach(x => x.setAttribute("aria-pressed", x === b));
    const next = document.querySelector(".nav .btn"); next.disabled = false;
    clearTimeout(bind._t); bind._t = setTimeout(() => go(state.step + 1), 320);
  }));

  const cta = $("#ctaLink");
  if (cta && !LINK_COMERCIAL) cta.addEventListener("click", e => { e.preventDefault(); toast("Link do comercial ainda não configurado."); });

  const refazer = $("#refazer");
  if (refazer) refazer.addEventListener("click", () => { state = blank(); go(0); });
}

/* se a etapa salva exige dados/respostas que não existem, volta para o início certo */
if (state.step >= Q0 && !dadosValidos()) state.step = 1;
if (state.step >= CONTATO && state.answers.some(a => !a)) state.step = Q0 + state.answers.findIndex(a => !a);
if (state.step > CONTATO && !contatoValido()) state.step = CONTATO;
render();
</script>
</body>
</html>
